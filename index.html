<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemainderX Uygulama Yükleme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .install-btn {
            background-color: #007aff;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .install-btn:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>

    <h2>📲 RemainderX Uygulamasını Yükle</h2>
    <p>iPhone'unuza uygulamayı yüklemek için aşağıdaki butona tıklayın.</p>

    <a class="install-btn" id="install-link">
        📥 Uygulamayı Yükle
    </a>

    <script>
        document.getElementById("install-link").addEventListener("click", function(event) {
            event.preventDefault();
            window.location.href = "itms-services://?action=download-manifest&url=https://remainderx-app.s3.eu-north-1.amazonaws.com/RemainderX.plist";
        });
    </script>

</body>
</html>
